name: Update World Cup Data

on:
  workflow_dispatch:
  schedule:
    # Beijing 09:00 and 13:30
    - cron: "0 1 * * *"
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update schedule
        run: node scripts/update-schedule.mjs
        env:
          SCHEDULE_SOURCE_URL: ${{ secrets.SCHEDULE_SOURCE_URL }}

      - name: Update results
        run: node scripts/update-results.mjs
        env:
          RESULTS_SOURCE_URL: ${{ secrets.RESULTS_SOURCE_URL }}

      - name: Commit changes
        run: |
          if git diff --quiet -- data.js; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "Update World Cup data"
          git push
